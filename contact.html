<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Matthew W. Brandenburg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Space Grotesk", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
          colors: { page: "#050505", card: "#0f0f0f", accent: "#3b82f6", dim: "#a1a1aa", border: "#27272a" },
          backgroundImage: { 'grid-pattern': "linear-gradient(to right, #27272a 1px, transparent 1px), linear-gradient(to bottom, #27272a 1px, transparent 1px)" },
          animation: { 'fade-in': 'fadeIn 0.6s ease-out forwards', 'float': 'float 6s ease-in-out infinite' },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050505; color: #e5e7eb; }
    .glass { background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .bg-grid { background-size: 40px 40px; mask-image: linear-gradient(to bottom, transparent, 5%, black, 95%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, 5%, black, 95%, transparent); }
    .magnetic-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
  </style>
</head>
<body class="font-sans antialiased selection:bg-accent selection:text-white overflow-hidden">

  <div class="fixed inset-0 z-0 pointer-events-none"><div class="absolute inset-0 bg-grid-pattern opacity-[0.07] bg-grid"></div></div>

  <nav class="fixed top-0 w-full z-50 px-4 py-4">
    <div class="glass max-w-5xl mx-auto rounded-2xl px-6 py-3 shadow-2xl shadow-black/50 transition-all duration-300">
      <div class="flex items-center justify-between">
        <a href="index.html" class="font-bold text-xl tracking-tight text-white flex items-center gap-2 group">
          <span class="text-accent font-mono group-hover:animate-pulse">&lt;MWB /&gt;</span>
        </a>
        <ul class="hidden md:flex gap-8 text-sm font-medium text-dim">
          <li><a href="about.html" class="hover:text-accent transition-colors">About</a></li>
          <li><a href="resume.html" class="hover:text-accent transition-colors">Resume</a></li>
          <li><a href="projects.html" class="hover:text-accent transition-colors">Projects</a></li>
          <li><a href="contact.html" class="text-white">Contact</a></li>
        </ul>
        <button id="mobile-menu-btn" class="md:hidden text-accent p-1 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>
      <div id="mobile-menu" class="hidden md:hidden mt-4 flex flex-col gap-4 text-sm font-mono text-dim pb-2 border-t border-white/10 pt-4 animate-fade-in">
        <a href="about.html" class="block hover:text-accent">About</a>
        <a href="resume.html" class="block hover:text-accent">Resume</a>
        <a href="projects.html" class="block hover:text-accent">Projects</a>
        <a href="contact.html" class="block hover:text-accent text-white">Contact</a>
      </div>
    </div>
  </nav>

  <main class="min-h-screen flex items-center justify-center relative z-10 animate-fade-in">
    <!-- Abstract Glow -->
    <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-accent/10 rounded-full blur-[100px] -z-10 animate-float"></div>

    <div class="max-w-4xl mx-auto px-4 text-center">
      <h1 class="text-5xl md:text-7xl font-bold text-white mb-8">Let's Build Something.</h1>
      <p class="text-dim text-lg mb-12 max-w-lg mx-auto">
        Always open to discussing new projects, internships, or engineering challenges.
      </p>

      <div class="flex flex-col md:flex-row items-center justify-center gap-6">
        <button onclick="copyEmail(this)" class="magnetic-btn inline-block px-8 py-4 bg-white text-black font-bold rounded-full transition-all duration-300">
          Copy Email Address
        </button>
        <a href="https://www.linkedin.com/in/matthew-brandenburg-944b4a379/" target="_blank" class="px-8 py-4 border border-white/20 text-dim hover:text-white hover:border-white rounded-full transition-all font-mono">
          LinkedIn
        </a>
      </div>

      <div class="mt-20 pt-8 border-t border-white/5 inline-block w-full max-w-md">
         <p class="text-xs text-dim font-mono">© 2025 Matthew W. Brandenburg</p>
      </div>
    </div>
  </main>

  <script>
    function copyEmail(btn) {
      const email = atob('bWF0dGJidXJnQG91dGxvb2suY29t');
      navigator.clipboard.writeText(email).then(() => {
        const originalText = btn.innerText;
        btn.innerText = "Copied!";
        btn.classList.add("bg-green-500", "text-white");
        btn.classList.remove("bg-white", "text-black");

        setTimeout(() => {
            btn.innerText = "Copy Email Address";
            btn.classList.remove("bg-green-500", "text-white");
            btn.classList.add("bg-white", "text-black");
        }, 2000);
      });
    }

    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    if(btn && menu) {
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    }
  </script>
</body>
</html>
